---
- name: Ensure no test profile exists before tests
  microsoft.scvmm.scvmm_physical_computer_profile:
    name: "{{ test_profile_name }}"
    state: absent
    vmm_server: "{{ scvmm_server }}"
  ignore_errors: true

- name: Ensure renamed profile does not exist
  microsoft.scvmm.scvmm_physical_computer_profile:
    name: "{{ test_profile_name }}-Renamed"
    state: absent
    vmm_server: "{{ scvmm_server }}"
  ignore_errors: true

- block:
    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test profile
      microsoft.scvmm.scvmm_physical_computer_profile:
        name: "{{ test_profile_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove renamed profile
      microsoft.scvmm.scvmm_physical_computer_profile:
        name: "{{ test_profile_name }}-Renamed"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Validate profiles removed
      microsoft.scvmm.scvmm_physical_computer_profile:
        name: "{{ test_profile_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      register: teardown_validate

    - name: Teardown - Assert server is clean
      ansible.builtin.assert:
        that:
          - teardown_validate.changed == false

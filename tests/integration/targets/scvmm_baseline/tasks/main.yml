---
- name: Define test variables
  ansible.builtin.set_fact:
    test_baseline_name: "AnsibleTest_Baseline_{{ 99999 | random }}"
    test_baseline_description: "Baseline created by integration tests"

- block:
    - name: Setup - Ensure WSUS server is registered
      microsoft.scvmm.scvmm_update_server:
        computer_name: "{{ test_wsus_server }}"
        tcp_port: "{{ test_wsus_port }}"
        credential: "{{ test_run_as_account }}"
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test baseline
      microsoft.scvmm.scvmm_baseline:
        name: "{{ test_baseline_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Validate baseline removed
      microsoft.scvmm.scvmm_baseline_info:
        name: "{{ test_baseline_name }}"
        vmm_server: "{{ scvmm_server }}"
      register: teardown_validate

    - name: Teardown - Assert server is clean
      ansible.builtin.assert:
        that:
          - teardown_validate.baselines | length == 0

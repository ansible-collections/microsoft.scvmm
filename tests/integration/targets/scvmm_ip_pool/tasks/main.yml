---
- name: Define test variables
  ansible.builtin.set_fact:
    test_ln_name: "AnsibleTest_IPPool_LN_{{ 99999 | random }}"
    test_lnd_name: "AnsibleTest_IPPool_LND_{{ 99999 | random }}"
    test_pool_name: "AnsibleTest_IPPool_{{ 99999 | random }}"
    test_subnet: "10.88.0.0/24"

- block:
    - name: Setup - Create logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Setup - Create logical network definition
      microsoft.scvmm.scvmm_logical_network_definition:
        name: "{{ test_lnd_name }}"
        logical_network: "{{ test_ln_name }}"
        host_groups:
          - All Hosts
        subnet_vlans:
          - subnet: "{{ test_subnet }}"
            vlan_id: 0
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml
  always:
    - name: Teardown - Remove IP pool
      microsoft.scvmm.scvmm_ip_pool:
        name: "{{ test_pool_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove logical network definition
      microsoft.scvmm.scvmm_logical_network_definition:
        name: "{{ test_lnd_name }}"
        logical_network: "{{ test_ln_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

---
- name: Define test variables
  ansible.builtin.set_fact:
    test_service_template_name: "AnsibleTest_SvcTmpl_{{ 99999 | random }}"

- block:
    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test service template
      microsoft.scvmm.scvmm_service_template:
        name: "{{ test_service_template_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Validate service template removed
      microsoft.scvmm.scvmm_service_template_info:
        name: "{{ test_service_template_name }}"
        vmm_server: "{{ scvmm_server }}"
      register: teardown_validate

    - name: Teardown - Assert server is clean
      ansible.builtin.assert:
        that:
          - teardown_validate.service_templates | length == 0

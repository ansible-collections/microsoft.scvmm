---
- name: Define test variables
  set_fact:
    test_cap_profile: "AnsibleTest_CapProfile_{{ 99999 | random }}"

- block:
    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test capability profile
      microsoft.scvmm.scvmm_capability_profile:
        name: "{{ test_cap_profile }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Validate profile removed
      microsoft.scvmm.scvmm_capability_profile:
        name: "{{ test_cap_profile }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      register: teardown_validate

    - name: Teardown - Assert server is clean
      assert:
        that:
          - teardown_validate.changed == false

---
- block:
    - name: Setup - Ensure WSUS server is not already registered
      microsoft.scvmm.scvmm_update_server:
        computer_name: "{{ test_wsus_server }}"
        credential: "{{ test_run_as_account }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test update server
      microsoft.scvmm.scvmm_update_server:
        computer_name: "{{ test_wsus_server }}"
        credential: "{{ test_run_as_account }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Validate update server removed
      microsoft.scvmm.scvmm_update_server_info:
        computer_name: "{{ test_wsus_server }}"
        vmm_server: "{{ scvmm_server }}"
      register: teardown_validate

    - name: Teardown - Assert server is clean
      ansible.builtin.assert:
        that:
          - teardown_validate.update_servers | length == 0

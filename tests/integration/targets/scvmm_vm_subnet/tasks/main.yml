---
- name: Define test variables
  ansible.builtin.set_fact:
    test_ln_name: "AnsibleTest_VMSub_LN_{{ 99999 | random }}"
    test_vmnet_name: "AnsibleTest_VMSub_VMNet_{{ 99999 | random }}"
    test_subnet_name: "AnsibleTest_VMSubnet_{{ 99999 | random }}"
    test_subnet_cidr: "10.99.1.0/24"
    test_vlan_id: 100

- name: Derive dependent test variables
  ansible.builtin.set_fact:
    test_logical_network_definition: "{{ test_ln_name }}_LND"

- block:
    - name: Setup - Create logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Setup - Create logical network definition
      microsoft.scvmm.scvmm_logical_network_definition:
        name: "{{ test_logical_network_definition }}"
        logical_network: "{{ test_ln_name }}"
        host_groups:
          - All Hosts
        subnet_vlans:
          - subnet: "10.99.0.0/24"
            vlan_id: 0
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Setup - Create VM network
      microsoft.scvmm.scvmm_vm_network:
        name: "{{ test_vmnet_name }}"
        logical_network: "{{ test_ln_name }}"
        isolation_type: WindowsNetworkVirtualization
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml
  always:
    - name: Teardown - Remove VM subnet
      microsoft.scvmm.scvmm_vm_subnet:
        name: "{{ test_subnet_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove VM network
      microsoft.scvmm.scvmm_vm_network:
        name: "{{ test_vmnet_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove logical network definition
      microsoft.scvmm.scvmm_logical_network_definition:
        name: "{{ test_logical_network_definition }}"
        logical_network: "{{ test_ln_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

---
- name: Define test variables
  ansible.builtin.set_fact:
    test_custom_prop_name: "AnsibleTest_CustomProp_{{ 99999 | random }}"
    test_custom_prop_nodesc_name: "AnsibleTest_NoDesc_{{ 99999 | random }}"

- block:
    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test custom property
      microsoft.scvmm.scvmm_custom_property:
        name: "{{ test_custom_prop_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove renamed test custom property
      microsoft.scvmm.scvmm_custom_property:
        name: "{{ test_custom_prop_name }}_renamed"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove no-description test custom property
      microsoft.scvmm.scvmm_custom_property:
        name: "{{ test_custom_prop_nodesc_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Validate custom properties removed
      microsoft.scvmm.scvmm_custom_property_info:
        vmm_server: "{{ scvmm_server }}"
      register: teardown_validate

    - name: Teardown - Assert server is clean
      ansible.builtin.assert:
        that:
          - test_custom_prop_name not in (teardown_validate.custom_properties | map(attribute='name') | list)
          - test_custom_prop_nodesc_name not in (teardown_validate.custom_properties | map(attribute='name') | list)

---
- name: Define test variables
  ansible.builtin.set_fact:
    test_template: "AnsibleTest_TemplateNic_{{ 99999 | random }}"
    test_ln_name: "AnsibleTest_TemplateNic_LN_{{ 99999 | random }}"
    test_vmnet_name: "AnsibleTest_TemplateNic_VMNet_{{ 99999 | random }}"

- block:
    - name: Setup - Create logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Setup - Create VM network
      microsoft.scvmm.scvmm_vm_network:
        name: "{{ test_vmnet_name }}"
        logical_network: "{{ test_ln_name }}"
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Setup - Clone template from base template
      microsoft.scvmm.scvmm_template:
        name: "{{ test_template }}"
        source_template: "{{ test_vm_template }}"
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test template
      microsoft.scvmm.scvmm_template:
        name: "{{ test_template }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove VM network
      microsoft.scvmm.scvmm_vm_network:
        name: "{{ test_vmnet_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

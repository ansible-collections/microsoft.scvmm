---
- name: Find an existing VM for rating tests
  microsoft.scvmm.scvmm_vm_info:
    vmm_server: "{{ scvmm_server }}"
  register: vm_lookup

- name: Store VM name
  ansible.builtin.set_fact:
    test_vm_name: "{{ (vm_lookup.virtual_machines | first).name | default('') }}"

- name: Skip tests if no VM available
  ansible.builtin.meta: end_play
  when: test_vm_name | length == 0

- name: Run tests
  ansible.builtin.include_tasks: tests.yml

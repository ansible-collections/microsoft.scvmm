---
- name: Define test variables
  ansible.builtin.set_fact:
    test_vm: "AnsibleTest_NIC_{{ 99999 | random }}"
    test_ln_name: "AnsibleTest_NIC_LN_{{ 99999 | random }}"
    test_vmnet_name: "AnsibleTest_NIC_VMNet_{{ 99999 | random }}"

- block:
    - name: Setup - Create logical network
      ansible.windows.win_shell: |
        $vmmServer = Get-SCVMMServer "{{ scvmm_server }}"
        New-SCLogicalNetwork -VMMServer $vmmServer -Name "{{ test_ln_name }}" -ErrorAction Stop | Out-Null
        "created"
      register: ln_setup

    - name: Setup - Create VM network
      microsoft.scvmm.scvmm_vm_network:
        name: "{{ test_vmnet_name }}"
        logical_network: "{{ test_ln_name }}"
        state: present
        vmm_server: "{{ scvmm_server }}"
      register: vmnet_setup

    - name: Setup - Create test VM
      microsoft.scvmm.scvmm_vm:
        name: "{{ test_vm }}"
        template: "{{ test_vm_template }}"
        vm_host: "{{ test_vm_host }}"
        vmm_server: "{{ scvmm_server }}"
        state: present

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test VM
      microsoft.scvmm.scvmm_vm:
        name: "{{ test_vm }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove VM network
      microsoft.scvmm.scvmm_vm_network:
        name: "{{ test_vmnet_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove logical network
      ansible.windows.win_shell: |
        $vmmServer = Get-SCVMMServer "{{ scvmm_server }}"
        $ln = Get-SCLogicalNetwork -VMMServer $vmmServer -Name "{{ test_ln_name }}" -ErrorAction SilentlyContinue
        if ($ln) {
          Get-SCVMNetwork -LogicalNetwork $ln | Remove-SCVMNetwork -Force -ErrorAction SilentlyContinue | Out-Null
          Remove-SCLogicalNetwork -LogicalNetwork $ln -Force -ErrorAction SilentlyContinue | Out-Null
        }
      ignore_errors: true

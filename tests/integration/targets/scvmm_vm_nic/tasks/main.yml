---
- name: Define test variables
  ansible.builtin.set_fact:
    test_vm: "AnsibleTest_VmNic_{{ 99999 | random }}"
    test_ln_name: "AnsibleTest_VmNic_LN_{{ 99999 | random }}"
    test_vmnet_name: "AnsibleTest_VmNic_VMNet_{{ 99999 | random }}"

- block:
    - name: Setup - Create logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Setup - Create VM network
      microsoft.scvmm.scvmm_vm_network:
        name: "{{ test_vmnet_name }}"
        logical_network: "{{ test_ln_name }}"
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Setup - Create test VM
      microsoft.scvmm.scvmm_vm:
        name: "{{ test_vm }}"
        template: "{{ test_vm_template }}"
        vm_host: "{{ test_vm_host }}"
        vmm_server: "{{ scvmm_server }}"
        state: present

    - name: Setup - Add adapter connected to VM network
      microsoft.scvmm.scvmm_network_adapter:
        vm_name: "{{ test_vm }}"
        vm_network: "{{ test_vmnet_name }}"
        vmm_server: "{{ scvmm_server }}"
        state: present

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test VM
      microsoft.scvmm.scvmm_vm:
        name: "{{ test_vm }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove VM network
      microsoft.scvmm.scvmm_vm_network:
        name: "{{ test_vmnet_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

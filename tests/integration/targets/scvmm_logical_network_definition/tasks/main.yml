---
- name: Define test variables
  ansible.builtin.set_fact:
    test_ln_name: "AnsibleTest_LNDef_LN_{{ 99999 | random }}"
    test_def_name: "AnsibleTest_LNDef_{{ 99999 | random }}"
    test_subnet: "10.{{ 254 | random }}.{{ 254 | random }}.0/24"
    test_vlan_id: "{{ range(100, 999) | random }}"

- block:
    - name: Setup - Create logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test definition
      microsoft.scvmm.scvmm_logical_network_definition:
        name: "{{ test_def_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

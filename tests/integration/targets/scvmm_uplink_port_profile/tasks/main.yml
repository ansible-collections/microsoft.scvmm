---
- name: Define test variables
  ansible.builtin.set_fact:
    test_profile_name: "AnsibleTest_UplinkProfile_{{ 99999 | random }}"
    test_ln_name: "AnsibleTest_Uplink_LN_{{ 99999 | random }}"

- name: Derive logical network definition name
  ansible.builtin.set_fact:
    test_logical_network_definition: "{{ test_ln_name }}_LND"

- block:
    - name: Setup - Create logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Setup - Create logical network definition
      microsoft.scvmm.scvmm_logical_network_definition:
        name: "{{ test_logical_network_definition }}"
        logical_network: "{{ test_ln_name }}"
        host_groups:
          - All Hosts
        subnet_vlans:
          - subnet: "10.98.0.0/24"
            vlan_id: 0
        state: present
        vmm_server: "{{ scvmm_server }}"

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test uplink port profile
      microsoft.scvmm.scvmm_uplink_port_profile:
        name: "{{ test_profile_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove logical network definition
      microsoft.scvmm.scvmm_logical_network_definition:
        name: "{{ test_logical_network_definition }}"
        logical_network: "{{ test_ln_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Remove logical network
      microsoft.scvmm.scvmm_logical_network:
        name: "{{ test_ln_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Validate profile removed
      microsoft.scvmm.scvmm_uplink_port_profile_info:
        name: "{{ test_profile_name }}"
        vmm_server: "{{ scvmm_server }}"
      register: teardown_validate

    - name: Teardown - Assert server is clean
      ansible.builtin.assert:
        that:
          - teardown_validate.uplink_port_profiles | length == 0

---
- name: Define test variables
  ansible.builtin.set_fact:
    test_sql_profile_name: "AnsibleTest_SQLProfile_{{ 99999 | random }}"

- block:
    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test SQL profile
      microsoft.scvmm.scvmm_sql_profile:
        name: "{{ test_sql_profile_name }}"
        state: absent
        vmm_server: "{{ scvmm_server }}"
      ignore_errors: true

    - name: Teardown - Validate SQL profile removed
      microsoft.scvmm.scvmm_sql_profile_info:
        name: "{{ test_sql_profile_name }}"
        vmm_server: "{{ scvmm_server }}"
      register: teardown_validate

    - name: Teardown - Assert server is clean
      ansible.builtin.assert:
        that:
          - teardown_validate.sql_profiles | length == 0

---
# ── Info: query all user roles ──
- name: Info - Query all user roles
  microsoft.scvmm.scvmm_user_role_info:
    vmm_server: "{{ scvmm_server }}"
  register: all_roles

- name: Assert info returns a list
  ansible.builtin.assert:
    that:
      - all_roles.user_roles is defined
      - all_roles.user_roles | length > 0

# ── Info: query non-existent role ──
- name: Info - Query non-existent user role
  microsoft.scvmm.scvmm_user_role_info:
    name: "NonExistent_UserRole_{{ 99999 | random }}"
    vmm_server: "{{ scvmm_server }}"
  register: non_existent

- name: Assert non-existent role returns empty list
  ansible.builtin.assert:
    that:
      - non_existent.user_roles | length == 0

# ── Info: check mode ──
- name: Info - Query in check mode
  microsoft.scvmm.scvmm_user_role_info:
    vmm_server: "{{ scvmm_server }}"
  check_mode: true
  register: info_check_mode

- name: Assert info works in check mode
  ansible.builtin.assert:
    that:
      - info_check_mode.user_roles is defined
      - info_check_mode is not changed

# ── Check mode: create ──
- name: Check mode - Create user role
  microsoft.scvmm.scvmm_user_role:
    name: "{{ test_user_role }}"
    description: "Ansible test user role"
    user_role_profile: DelegatedAdmin
    state: present
    vmm_server: "{{ scvmm_server }}"
  check_mode: true
  register: check_create

- name: Assert check mode create reports changed
  ansible.builtin.assert:
    that:
      - check_create is changed

- name: Verify check mode did not create role
  microsoft.scvmm.scvmm_user_role_info:
    name: "{{ test_user_role }}"
    vmm_server: "{{ scvmm_server }}"
  register: verify_check_create

- name: Assert role was not actually created
  ansible.builtin.assert:
    that:
      - verify_check_create.user_roles | length == 0

# ── Create user role ──
- name: Create user role
  microsoft.scvmm.scvmm_user_role:
    name: "{{ test_user_role }}"
    description: "Ansible test user role"
    user_role_profile: DelegatedAdmin
    state: present
    vmm_server: "{{ scvmm_server }}"
  register: create_result

- name: Assert user role was created
  ansible.builtin.assert:
    that:
      - create_result is changed
      - create_result.user_role.name == test_user_role
      - create_result.user_role.description == "Ansible test user role"
      - create_result.user_role.user_role_profile == "DelegatedAdmin"
      - create_result.user_role.id is defined

# ── Verify creation with info module ──
- name: Verify user role exists via info module
  microsoft.scvmm.scvmm_user_role_info:
    name: "{{ test_user_role }}"
    vmm_server: "{{ scvmm_server }}"
  register: verify_create

- name: Assert info module sees the created role
  ansible.builtin.assert:
    that:
      - verify_create.user_roles | length == 1
      - verify_create.user_roles[0].name == test_user_role
      - verify_create.user_roles[0].id is defined
      - verify_create.user_roles[0].description == "Ansible test user role"
      - verify_create.user_roles[0].user_role_profile == "DelegatedAdmin"

# ── Create idempotency ──
- name: Create same user role again (idempotency)
  microsoft.scvmm.scvmm_user_role:
    name: "{{ test_user_role }}"
    description: "Ansible test user role"
    user_role_profile: DelegatedAdmin
    state: present
    vmm_server: "{{ scvmm_server }}"
  register: idempotent_result

- name: Assert no change on idempotent create
  ansible.builtin.assert:
    that:
      - idempotent_result is not changed

# ── Check mode: update ──
- name: Check mode - Update description
  microsoft.scvmm.scvmm_user_role:
    name: "{{ test_user_role }}"
    description: "Check mode updated description"
    state: present
    vmm_server: "{{ scvmm_server }}"
  check_mode: true
  register: check_update

- name: Assert check mode update reports changed
  ansible.builtin.assert:
    that:
      - check_update is changed

- name: Verify check mode did not update
  microsoft.scvmm.scvmm_user_role_info:
    name: "{{ test_user_role }}"
    vmm_server: "{{ scvmm_server }}"
  register: verify_check_update

- name: Assert description unchanged after check mode
  ansible.builtin.assert:
    that:
      - verify_check_update.user_roles[0].description == "Ansible test user role"

# ── Update description ──
- name: Update user role description
  microsoft.scvmm.scvmm_user_role:
    name: "{{ test_user_role }}"
    description: "Updated test description"
    state: present
    vmm_server: "{{ scvmm_server }}"
  register: update_result

- name: Assert description was updated
  ansible.builtin.assert:
    that:
      - update_result is changed
      - update_result.user_role.description == "Updated test description"

# ── Verify update with info module ──
- name: Verify description update via info module
  microsoft.scvmm.scvmm_user_role_info:
    name: "{{ test_user_role }}"
    vmm_server: "{{ scvmm_server }}"
  register: verify_update

- name: Assert info module sees updated description
  ansible.builtin.assert:
    that:
      - verify_update.user_roles[0].description == "Updated test description"

# ── Update idempotency ──
- name: Update same description again (idempotency)
  microsoft.scvmm.scvmm_user_role:
    name: "{{ test_user_role }}"
    description: "Updated test description"
    state: present
    vmm_server: "{{ scvmm_server }}"
  register: update_idempotent

- name: Assert update idempotent
  ansible.builtin.assert:
    that:
      - update_idempotent is not changed

# ── Info: query specific role returns all fields ──
- name: Info - Query specific role for field assertions
  microsoft.scvmm.scvmm_user_role_info:
    name: "{{ test_user_role }}"
    vmm_server: "{{ scvmm_server }}"
  register: info_fields

- name: Assert all info return fields are present
  ansible.builtin.assert:
    that:
      - info_fields.user_roles[0].id is defined
      - info_fields.user_roles[0].name is defined
      - info_fields.user_roles[0].description is defined
      - info_fields.user_roles[0].user_role_profile is defined

# ── Delete user role ──
- name: Delete user role
  microsoft.scvmm.scvmm_user_role:
    name: "{{ test_user_role }}"
    state: absent
    vmm_server: "{{ scvmm_server }}"
  register: delete_result

- name: Assert user role was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

# ── Verify deletion with info module ──
- name: Verify user role is gone via info module
  microsoft.scvmm.scvmm_user_role_info:
    name: "{{ test_user_role }}"
    vmm_server: "{{ scvmm_server }}"
  register: verify_delete

- name: Assert info module returns empty for deleted role
  ansible.builtin.assert:
    that:
      - verify_delete.user_roles | length == 0

# ── Absent idempotency ──
- name: Delete already-deleted user role
  microsoft.scvmm.scvmm_user_role:
    name: "{{ test_user_role }}"
    state: absent
    vmm_server: "{{ scvmm_server }}"
  register: absent_noop

- name: Assert no change on absent idempotency
  ansible.builtin.assert:
    that:
      - absent_noop is not changed

# ── Re-create for create without profile test ──
- name: Re-create user role for further tests
  microsoft.scvmm.scvmm_user_role:
    name: "{{ test_user_role }}"
    description: "Re-created for tests"
    user_role_profile: DelegatedAdmin
    state: present
    vmm_server: "{{ scvmm_server }}"
  register: recreate_result

- name: Assert re-creation succeeded
  ansible.builtin.assert:
    that:
      - recreate_result is changed

# ── Create without user_role_profile should fail ──
- name: Create user role without profile (should fail)
  microsoft.scvmm.scvmm_user_role:
    name: "NonExistent_UserRole_{{ 99999 | random }}"
    description: "Should fail"
    state: present
    vmm_server: "{{ scvmm_server }}"
  register: no_profile_result
  ignore_errors: true

- name: Assert create without profile fails
  ansible.builtin.assert:
    that:
      - no_profile_result is failed
      - "'user_role_profile' in no_profile_result.msg"

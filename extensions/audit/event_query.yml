---
# Indirect Node Counting query for microsoft.scvmm collection
# SCVMM is a private cloud hypervisor manager (Hyper-V)
# Taxonomy: infra_type=private_cloud, platform=scvmm

# --- Compute: Virtual Machines ---
microsoft.scvmm.scvmm_vm:
  query: >-
    .vm | select(. != null) | {
      name: ("scvmm_vm:" + (.name | tostring)),
      canonical_facts: {
        module: "scvmm_vm",
        id: .id
      },
      facts: {
        infra_type: "private_cloud",
        infra_bucket: "compute",
        device_type: "virtual_machine",
        platform: "scvmm"
      }
    }
microsoft.scvmm.scvmm_vm_info:
  query: >-
    .virtual_machines[] | {
      name: ("scvmm_vm_info:" + (.name | tostring)),
      canonical_facts: {
        module: "scvmm_vm_info",
